title: Móricz Zsigmond Gimnázium
description: Tiszakécske
markdown: kramdown
permalink: /hirek/:title/
collections:
  posts:
    output: true

plugins:
  - jekyll-feed
  - jekyll-sitemap

# Every file in _posts automatically uses the "post" layout (_layouts/post.html),
# even if the CMS or an editor forgets to set "layout:" in the front matter.
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# GitHub Pages builds this automatically with the "github-pages" gem — no extra setup needed.
# Netlify builds it using the Gemfile + netlify.toml at the repo root instead.
